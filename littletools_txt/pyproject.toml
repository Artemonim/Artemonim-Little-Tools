[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "littletools-txt"
version = "1.0.0"
description = "Text processing tools for LittleTools project."
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "littletools-core",
    "requests>=2.28.0",
    "beautifulsoup4>=4.11.0",
    "pypandoc>=1.13",
    "typer[all]>=0.9.0",
    "rich>=13.0.0"
]

[project.scripts]
telegram-distiller = "littletools_txt.Telegram_Chats_Distiller:main"
syntx-downloader = "littletools_txt.SyntxAiDownloader:main"
wmd-converter = "littletools_txt.WMDconverter:main"
cyrillic-remover = "littletools_txt.CyrillicRemover:app"

[project.entry-points."littletools.commands"]
cyrillic-remover = "littletools_txt.CyrillicRemover:app"
telegram-distiller = "littletools_txt.Telegram_Chats_Distiller:app"
syntx-downloader = "littletools_txt.SyntxAiDownloader:app"
wmd-converter = "littletools_txt.WMDconverter:app"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0",
]

[tool.setuptools.packages.find]
where = ["."] 

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--verbose",
    "--tb=short",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]

[tool.coverage.run]
source = ["littletools_txt"]
omit = [
    "*/tests/*",
    "*/test_*",
    "*/__pycache__/*",
    "*/.*/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
] 